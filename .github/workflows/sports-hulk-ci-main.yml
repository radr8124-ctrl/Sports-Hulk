name: Sports HULK CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sports-hulk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Sports HULK
    runs-on:
      - self-hosted
      - Linux
      - ARM64

    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

