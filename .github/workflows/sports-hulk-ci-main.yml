name: Sports HULK CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sports-hulk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Betting proof and commercial UI checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install proof test dependencies
        run: python -m pip install numpy pandas requests pyarrow pypdf

      - name: Validate betting builders and Python proof
        run: |
          python -m py_compile \
            intelligence_warehouse/betting_v2/build_betting_v2_all_markets.py \
            intelligence_warehouse/betting_v2/build_betting_v2_all_markets_forward.py \
            intelligence_warehouse/betting_v2/build_clv_tracker.py \
            intelligence_warehouse/brain_performance/build_brain_performance.py
          python -m unittest discover -s tests -p 'test_*regime*.py'
          python -m unittest discover -s tests -p 'test_nba_*proof*.py'
          python -m unittest discover -s tests -p 'test_forward_results_provenance.py'
          python -m unittest discover -s tests -p 'test_mlb_pending_source_audit.py'
          python -m unittest discover -s tests -p 'test_nfl_official_player_identity.py'
          python -m unittest discover -s tests -p 'test_nhl_official_box_forward.py'
          python -m unittest discover -s tests -p 'test_mlb_official_box_forward.py'
          python -m unittest discover -s tests -p 'test_mlb_verified_player_crosswalk.py'
          python -m unittest discover -s tests -p 'test_mlb_automatic_catchup.py'
          python -m unittest discover -s tests -p 'test_mlb_forward_id_capture.py'
          python -m unittest discover -s tests -p 'test_prop_v2_csv_stability.py'
          python -m unittest discover -s tests -p 'test_survivor_duplicate_tickets.py'
          python -m unittest discover -s tests -p 'test_mlb_rolling_schedule_windows.py'
          python -m unittest discover -s tests -p 'test_mlb_frozen_event_fallback.py'
          python -m unittest discover -s tests -p 'test_mlb_master_freshness.py'
          python -m unittest discover -s tests -p 'test_sports_workflow_safety.py'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: commercial_web/package-lock.json

      - name: Install commercial dependencies
        run: npm ci --prefix commercial_web

      - name: Validate commercial API and UI
        run: |
          node --check commercial_web/server.js
          (cd commercial_web && node --test ./*.test.js)
          npm run build --prefix commercial_web

      - name: CI is read-only
        run: echo "Checks passed. No production deployment occurs on push."
