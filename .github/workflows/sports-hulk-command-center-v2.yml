name: Sports HULK Command Center V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy actual approved Command Center layout
    runs-on:
      - self-hosted
      - Linux
      - ARM64

    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Write rebuilt Command Center UI
        shell: bash
        run: |
          echo '' | base64 -d > hulk_final_ui.py

      - name: Verify real layout code
        run: |
          grep -q 'mock-hero' hulk_final_ui.py
          grep -q 'mock-kpis' hulk_final_ui.py
          grep -q 'mock-grid' hulk_final_ui.py
          grep -q 'MARKET MOVEMENT' hulk_final_ui.py
          grep -q 'HULK VS MARKET' hulk_final_ui.py
          grep -q 'PLAYER PROPS SPOTLIGHT' hulk_final_ui.py
          grep -q 'PARLAY CHEMISTRY' hulk_final_ui.py
          grep -q 'PRIZEPICKS BOARD' hulk_final_ui.py
          grep -q 'FANTASY / WAIVER WIRE' hulk_final_ui.py
          grep -q 'QUICK DEEP DIVE' hulk_final_ui.py
          python3 -m py_compile app.py hulk_final_ui.py prop_intelligence/hulk_prop_ui.py self_test_ui_contract.py mcp_hulk/server.py
          python3 self_test_ui_contract.py
          git diff --check

      - name: Commit to main
        run: |
          git config user.name "Sports HULK Build Bot"
          git config user.email "actions@github.com"
          git add hulk_final_ui.py
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Rebuild Command Center to approved dashboard layout"
            git push origin HEAD:main
          fi

      - name: Replace live UI directly
        run: |
          cp hulk_final_ui.py /home/ubuntu/sports-hulk/hulk_final_ui.py
          cd /home/ubuntu/sports-hulk
          .venv/bin/python -m py_compile app.py hulk_final_ui.py prop_intelligence/hulk_prop_ui.py self_test_ui_contract.py mcp_hulk/server.py
          .venv/bin/python self_test_ui_contract.py
          grep -q 'QUICK DEEP DIVE' hulk_final_ui.py
          grep -q 'HULK VS MARKET' hulk_final_ui.py
          grep -q 'PRIZEPICKS BOARD' hulk_final_ui.py

      - name: Restart live Sports HULK
        run: |
          sudo systemctl restart sports-hulk
          sleep 8
          sudo systemctl is-active sports-hulk
          curl -fI http://127.0.0.1:8501
          curl -fI http://127.0.0.1

      - name: Complete
        run: |
          echo "========================================"
          echo "SPORTS HULK COMMAND CENTER V2: PASS"
          echo "Live: http://129.213.178.205"
          echo "========================================"
