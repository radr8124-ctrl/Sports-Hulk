name: Sports HULK Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-live-build:
    name: Import current Sports HULK Oracle build
    runs-on:
      - self-hosted
      - Linux
      - ARM64

    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure rsync is installed
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rsync

      - name: Copy current Sports HULK source from Oracle
        run: |
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude '.venv/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude '*.parquet' \
            --exclude 'raw/' \
            --exclude 'history/' \
            --exclude 'logs/' \
            --exclude 'backups/' \
            --exclude '*.db' \
            --exclude '*.sqlite' \
            --exclude '*.sqlite3' \
            --exclude '*.backup' \
            --exclude '*.backup_*' \
            --exclude '*.bak' \
            --exclude '*.bak_*' \
            --exclude '*.pre_*' \
            /home/ubuntu/sports-hulk/ \
            "$GITHUB_WORKSPACE/"

      - name: Verify important source files exist
        run: |
          test -f app.py
          test -f hulk_final_ui.py
          test -f mcp_hulk/server.py
          echo "Core Sports HULK source files found."

      - name: Commit Sports HULK source to main
        run: |
          git config user.name "Sports HULK Deploy Bot"
          git config user.email "actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Import current Sports HULK Oracle build"
            git push origin HEAD:main
          fi

      - name: Bootstrap complete
        run: |
          echo "========================================"
          echo "SPORTS HULK BOOTSTRAP: PASS"
          echo "Core source imported to GitHub."
          echo "Secrets, raw/history data, parquet files,"
          echo "runtime databases, logs, backups, and venv were excluded."
          echo "========================================"
