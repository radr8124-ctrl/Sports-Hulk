name: Sports HULK Promote Final Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    name: Promote final-ui-rebuild to main
    runs-on:
      - self-hosted
      - Linux
      - ARM64

    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch final feature branch
        run: |
          git fetch origin feature/final-ui-rebuild

      - name: Copy tested Sports HULK files from feature branch
        run: |
          git checkout origin/feature/final-ui-rebuild --             app.py             hulk_final_ui.py             prop_intelligence/hulk_prop_ui.py             self_test_ui_contract.py

      - name: Verify promoted build before main commit
        run: |
          python3 -m py_compile app.py
          python3 -m py_compile hulk_final_ui.py
          python3 -m py_compile prop_intelligence/hulk_prop_ui.py
          python3 -m py_compile self_test_ui_contract.py
          python3 self_test_ui_contract.py
          git diff --check

      - name: Commit promoted build to main
        run: |
          git config user.name "Sports HULK Build Bot"
          git config user.email "actions@github.com"
          git add app.py hulk_final_ui.py prop_intelligence/hulk_prop_ui.py self_test_ui_contract.py

          if git diff --cached --quiet; then
            echo "Main already contains the final Sports HULK build."
          else
            git commit -m "Promote final Sports HULK rebuild"
            git push origin HEAD:main
          fi

      - name: Promotion complete
        run: |
          echo "========================================"
          echo "SPORTS HULK PROMOTION: PASS"
          echo "Final tested UI is now on main."
          echo "Normal Sports HULK CI/Deploy should follow."
          echo "========================================"
