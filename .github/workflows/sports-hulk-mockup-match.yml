name: Sports HULK Mockup Match

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  match:
    name: Make live Command Center match approved mockup
    runs-on:
      - self-hosted
      - Linux
      - ARM64

    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Write exact Command Center visual rebuild
        shell: bash
        run: |
          echo '' | base64 -d > hulk_final_ui.py

      - name: Verify mockup-match UI
        run: |
          grep -q 'cc-kpis' hulk_final_ui.py
          grep -q 'TODAY.*S TOP PLAYS' hulk_final_ui.py
          grep -q 'MARKET MOVEMENT' hulk_final_ui.py
          grep -q 'HULK VS MARKET' hulk_final_ui.py
          grep -q 'PLAYER PROPS SPOTLIGHT' hulk_final_ui.py
          grep -q 'PARLAY CHEMISTRY' hulk_final_ui.py
          grep -q 'PRIZEPICKS BOARD' hulk_final_ui.py
          grep -q 'FANTASY / WAIVER WIRE' hulk_final_ui.py
          python3 -m py_compile hulk_final_ui.py
          python3 self_test_ui_contract.py
          git diff --check

      - name: Commit to main
        run: |
          git config user.name "Sports HULK Build Bot"
          git config user.email "actions@github.com"
          git add hulk_final_ui.py
          if git diff --cached --quiet; then
            echo "Main already contains this Command Center."
          else
            git commit -m "Match Sports HULK Command Center to approved visual"
            git push origin HEAD:main
          fi

      - name: Replace live UI file
        run: |
          cp hulk_final_ui.py /home/ubuntu/sports-hulk/hulk_final_ui.py
          cd /home/ubuntu/sports-hulk
          .venv/bin/python -m py_compile hulk_final_ui.py
          .venv/bin/python self_test_ui_contract.py

      - name: Restart and verify live app
        run: |
          sudo systemctl restart sports-hulk
          sleep 8
          sudo systemctl is-active sports-hulk
          curl -fI http://127.0.0.1:8501
          curl -fI http://127.0.0.1

      - name: Complete
        run: |
          echo "========================================"
          echo "SPORTS HULK MOCKUP MATCH: PASS"
          echo "Live: http://129.213.178.205"
          echo "========================================"
