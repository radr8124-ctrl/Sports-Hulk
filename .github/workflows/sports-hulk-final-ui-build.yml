name: Sports HULK Final UI Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-final-ui:
    name: Build Sports HULK Command Center
    runs-on:
      - self-hosted
      - Linux
      - ARM64

    timeout-minutes: 20

    steps:
      - name: Checkout stable main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create clean feature branch
        run: |
          git checkout -B feature/final-ui-rebuild origin/main

      - name: Apply Sports HULK Phase 1 build
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/sports_hulk_phase1.patch
          git apply --check /tmp/sports_hulk_phase1.patch
          git apply /tmp/sports_hulk_phase1.patch

      - name: Compile and regression-test
        run: |
          python3 -m py_compile app.py
          python3 -m py_compile hulk_final_ui.py
          python3 -m py_compile prop_intelligence/hulk_prop_ui.py
          python3 -m py_compile self_test_ui_contract.py
          python3 -m py_compile mcp_hulk/server.py
          python3 self_test_ui_contract.py
          git diff --check

      - name: Commit feature build
        run: |
          git config user.name "Sports HULK Build Bot"
          git config user.email "actions@github.com"
          git add app.py hulk_final_ui.py prop_intelligence/hulk_prop_ui.py self_test_ui_contract.py
          git commit -m "Build Sports HULK command center and league foundations"

      - name: Push feature branch
        run: |
          git push --force origin feature/final-ui-rebuild

      - name: Build complete
        run: |
          echo "========================================"
          echo "SPORTS HULK PHASE 1 BUILD: PASS"
          echo "Branch: feature/final-ui-rebuild"
          echo "Command Center + navigation + Survivor + PrizePicks + Top 300 foundations are ready."
          echo "========================================"
