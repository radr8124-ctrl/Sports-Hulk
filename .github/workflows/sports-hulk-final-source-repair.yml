name: Sports HULK Final Source Repair

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    name: Replace old live source with verified final build
    runs-on:
      - self-hosted
      - Linux
      - ARM64

    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Write verified final Sports HULK files
        shell: bash
        run: |
          mkdir -p prop_intelligence
          echo '' | base64 -d > app.py
          echo '' | base64 -d > hulk_final_ui.py
          echo '' | base64 -d > self_test_ui_contract.py
          echo '' | base64 -d > prop_intelligence/hulk_prop_ui.py

      - name: Prove repo files are the new UI
        run: |
          grep -q '"Command Center"' app.py
          grep -q '"Game Research"' app.py
          grep -q '"Bet Tracker"' app.py
          grep -q '"Performance Lab"' app.py
          grep -q '"Historical Explorer"' app.py
          grep -q '"Top 300 Cheat Sheet"' app.py
          grep -q '"NFL Weather"' app.py
          grep -q '"CFB Over / Unders"' app.py
          grep -q 'EVERYTHING THAT MATTERS.' hulk_final_ui.py

          python3 -m py_compile app.py
          python3 -m py_compile hulk_final_ui.py
          python3 -m py_compile prop_intelligence/hulk_prop_ui.py
          python3 -m py_compile self_test_ui_contract.py
          python3 self_test_ui_contract.py

          echo "VERIFIED FINAL SOURCE: PASS"

      - name: Commit verified final source to main
        run: |
          git config user.name "Sports HULK Build Bot"
          git config user.email "actions@github.com"
          git add app.py hulk_final_ui.py self_test_ui_contract.py prop_intelligence/hulk_prop_ui.py

          if git diff --cached --quiet; then
            echo "Main already contains verified final source."
          else
            git commit -m "Repair Sports HULK final source"
            git push origin HEAD:main
          fi

      - name: Copy exact verified files to live Oracle
        run: |
          cp app.py /home/ubuntu/sports-hulk/app.py
          cp hulk_final_ui.py /home/ubuntu/sports-hulk/hulk_final_ui.py
          cp self_test_ui_contract.py /home/ubuntu/sports-hulk/self_test_ui_contract.py
          cp prop_intelligence/hulk_prop_ui.py /home/ubuntu/sports-hulk/prop_intelligence/hulk_prop_ui.py

      - name: Prove LIVE app.py changed
        working-directory: /home/ubuntu/sports-hulk
        run: |
          echo "LIVE SHA256:"
          sha256sum app.py

          grep -q '"Command Center"' app.py
          grep -q '"Game Research"' app.py
          grep -q '"Bet Tracker"' app.py
          grep -q '"Performance Lab"' app.py
          grep -q '"Historical Explorer"' app.py
          grep -q 'EVERYTHING THAT MATTERS.' hulk_final_ui.py

          echo "-- LIVE BETTING MENU --"
          grep -n -A14 -B2 'mode == "🎯 Betting"' app.py | head -30

          .venv/bin/python -m py_compile app.py
          .venv/bin/python -m py_compile hulk_final_ui.py
          .venv/bin/python -m py_compile prop_intelligence/hulk_prop_ui.py
          .venv/bin/python self_test_ui_contract.py

          echo "LIVE VERIFIED FINAL SOURCE: PASS"

      - name: Restart live Sports HULK
        run: |
          sudo systemctl restart sports-hulk
          sleep 8
          sudo systemctl is-active sports-hulk
          curl -fI http://127.0.0.1:8501
          curl -fI http://127.0.0.1

      - name: Repair complete
        run: |
          echo "========================================"
          echo "SPORTS HULK FINAL SOURCE REPAIR: PASS"
          echo "Old app.py has been physically replaced."
          echo "Expected first Betting item: Command Center"
          echo "========================================"
