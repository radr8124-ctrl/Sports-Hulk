name: Sports HULK Release Gate (No Auto Deploy)

# Deliberately MANUAL and READ-ONLY. The former workflow_run deploy used
# rsync --delete against the live code/data tree and restarted the wrong
# Sports HULK service. Production changes require an authorized VPS session
# with an explicit preflight, backup and live smoke check.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sports-hulk-manual-release-check
  cancel-in-progress: false

jobs:
  release-check:
    name: Manual release validation (does not deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v4

      - name: Require main for release review
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          echo "Reviewing ${GITHUB_SHA}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install proof test dependencies
        run: python -m pip install numpy pandas

      - name: Run proof and deployment safety tests
        run: |
          python -m unittest discover -s tests -p 'test_*regime*.py'
          python -m unittest discover -s tests -p 'test_sports_workflow_safety.py'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate commercial app
        run: |
          npm ci --prefix commercial_web
          (cd commercial_web && node --test ./*.test.js)
          npm run build --prefix commercial_web

      - name: Print release instructions
        run: |
          echo "RELEASE CHECK PASSED. This workflow NEVER writes to live servers."
          echo "To deploy, use the authorized VPS connection after checking live"
          echo "uncommitted source/runtime changes, taking a backup, and getting"
          echo "explicit approval for the specific release."
          echo "Correct commercial service: systemctl --user restart sports-hulk-commercial.service"
