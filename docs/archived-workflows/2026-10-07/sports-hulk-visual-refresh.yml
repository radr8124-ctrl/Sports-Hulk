name: Sports HULK Visual Refresh

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Deploy colorful Sports HULK UI refresh
    runs-on:
      - self-hosted
      - Linux
      - ARM64

    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Write verified visual refresh
        shell: bash
        run: |
          echo '' | base64 -d > app.py
          echo '' | base64 -d > hulk_final_ui.py
          echo '' | base64 -d > self_test_ui_contract.py

      - name: Verify visual/product contract
        run: |
          grep -q '"MLB PrizePicks"' app.py
          grep -q 'SATURDAY BOARD.' hulk_final_ui.py
          grep -q 'spectrum-strip' hulk_final_ui.py
          grep -q 'market-card' hulk_final_ui.py
          grep -q 'BASEBALL <span class="blue">WITHOUT THE CLUTTER.' hulk_final_ui.py

          python3 -m py_compile app.py
          python3 -m py_compile hulk_final_ui.py
          python3 -m py_compile self_test_ui_contract.py
          python3 -m py_compile prop_intelligence/hulk_prop_ui.py
          python3 self_test_ui_contract.py
          git diff --check

      - name: Commit refresh to main
        run: |
          git config user.name "Sports HULK Build Bot"
          git config user.email "actions@github.com"
          git add app.py hulk_final_ui.py self_test_ui_contract.py

          if git diff --cached --quiet; then
            echo "Main already contains visual refresh."
          else
            git commit -m "Refresh Sports HULK visual system"
            git push origin HEAD:main
          fi

      - name: Copy exact refresh to live Oracle
        run: |
          cp app.py /home/ubuntu/sports-hulk/app.py
          cp hulk_final_ui.py /home/ubuntu/sports-hulk/hulk_final_ui.py
          cp self_test_ui_contract.py /home/ubuntu/sports-hulk/self_test_ui_contract.py

      - name: Prove live source
        working-directory: /home/ubuntu/sports-hulk
        run: |
          grep -q '"MLB PrizePicks"' app.py
          grep -q 'SATURDAY BOARD.' hulk_final_ui.py
          grep -q 'spectrum-strip' hulk_final_ui.py
          grep -q 'market-card' hulk_final_ui.py
          grep -q 'BASEBALL <span class="blue">WITHOUT THE CLUTTER.' hulk_final_ui.py

          .venv/bin/python -m py_compile app.py
          .venv/bin/python -m py_compile hulk_final_ui.py
          .venv/bin/python self_test_ui_contract.py
          echo "LIVE VISUAL SOURCE: PASS"

      - name: Restart Sports HULK
        run: |
          sudo systemctl restart sports-hulk
          sleep 8
          sudo systemctl is-active sports-hulk
          curl -fI http://127.0.0.1:8501
          curl -fI http://127.0.0.1

      - name: Refresh complete
        run: |
          echo "========================================"
          echo "SPORTS HULK VISUAL REFRESH: PASS"
          echo "MLB PrizePicks is inside MLB."
          echo "MLB Best Bets stays useful even with zero official bets."
          echo "CFB gets the new colorful command center."
          echo "Market cards are reformatted for readability."
          echo "========================================"
