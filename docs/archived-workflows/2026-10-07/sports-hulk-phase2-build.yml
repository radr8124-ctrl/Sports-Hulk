name: Sports HULK Phase 2 Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase2:
    name: Add Fantasy + Historical Intelligence
    runs-on:
      - self-hosted
      - Linux
      - ARM64

    timeout-minutes: 20

    steps:
      - name: Checkout Phase 1 feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/final-ui-rebuild
          fetch-depth: 0

      - name: Apply Phase 2
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/sports_hulk_phase2.patch
          patch -p1 --forward < /tmp/sports_hulk_phase2.patch

      - name: Compile and regression-test
        run: |
          python3 -m py_compile app.py
          python3 -m py_compile hulk_final_ui.py
          python3 -m py_compile prop_intelligence/hulk_prop_ui.py
          python3 -m py_compile self_test_ui_contract.py
          python3 -m py_compile mcp_hulk/server.py
          python3 self_test_ui_contract.py
          git diff --check

      - name: Commit Phase 2
        run: |
          git config user.name "Sports HULK Build Bot"
          git config user.email "actions@github.com"
          git add app.py hulk_final_ui.py self_test_ui_contract.py
          git commit -m "Add league-aware fantasy and historical intelligence"

      - name: Push updated feature branch
        run: |
          git push origin feature/final-ui-rebuild

      - name: Phase 2 complete
        run: |
          echo "========================================"
          echo "SPORTS HULK PHASE 2: PASS"
          echo "Branch: feature/final-ui-rebuild"
          echo "Fantasy league-awareness + Historical Explorer added."
          echo "========================================"
