name: Sports HULK Final Polish Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase4:
    name: Final UI Polish + League Consistency
    runs-on:
      - self-hosted
      - Linux
      - ARM64

    timeout-minutes: 20

    steps:
      - name: Checkout current feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/final-ui-rebuild
          fetch-depth: 0

      - name: Apply final polish
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/sports_hulk_phase4.patch
          patch -p1 --forward < /tmp/sports_hulk_phase4.patch

      - name: Compile and run full UI contract
        run: |
          python3 -m py_compile app.py
          python3 -m py_compile hulk_final_ui.py
          python3 -m py_compile prop_intelligence/hulk_prop_ui.py
          python3 -m py_compile self_test_ui_contract.py
          python3 -m py_compile mcp_hulk/server.py
          python3 self_test_ui_contract.py
          git diff --check

      - name: Commit final polish
        run: |
          git config user.name "Sports HULK Build Bot"
          git config user.email "actions@github.com"
          git add app.py hulk_final_ui.py self_test_ui_contract.py
          git commit -m "Finish Sports HULK UI polish and league consistency"

      - name: Push updated feature branch
        run: |
          git push origin feature/final-ui-rebuild

      - name: Final polish complete
        run: |
          echo "========================================"
          echo "SPORTS HULK FINAL POLISH: PASS"
          echo "Branch: feature/final-ui-rebuild"
          echo "Ready for final merge and live deploy."
          echo "========================================"
